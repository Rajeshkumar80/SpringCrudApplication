services:
  mysql:
    image: mysql:8.4
    container_name: product-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: productdb
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: product-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: product-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/productdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      JWT_SECRET: ${JWT_SECRET:OB/OiiculTHXfYAeznVX1gikZPY2oSs9s6oi0LuqsCnEz4rIVAq5kCfLGVVK1J+mNtrJU7Mukpon86IOFOJqyw==}
      FILE_UPLOAD_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-8888}:8888"
    volumes:
      - uploads-data:/app/uploads

  frontend:
    build:
      context: product-frontend
      dockerfile: Dockerfile
    container_name: product-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  mysql-data:
  ollama-data:
  uploads-data: